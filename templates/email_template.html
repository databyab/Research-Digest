<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Research Digest</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f6f7f9; font-family: Arial, sans-serif; color: #1f2933;">
    <div style="max-width: 760px; margin: 0 auto; padding: 28px 16px;">
      <div style="background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 28px;">
        <p style="margin: 0 0 6px; color: #667085; font-size: 13px;">{date}</p>
        <h1 style="font-size: 26px; line-height: 1.25; margin: 0 0 24px; color: #111827;">Research Digest</h1>

        <div style="font-size: 15px; line-height: 1.65;">
          {digest}
        </div>

        <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 28px 0 20px;">

        <h2 style="font-size: 16px; margin: 0 0 12px; color: #111827;">Sources</h2>
        <ul style="margin: 0 0 0 22px; padding: 0; font-size: 14px; line-height: 1.5;">{article_links}</ul>
      </div>
    </div>
  </body>
</html>
